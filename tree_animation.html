
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<div id="chi-trees">
  <div id="chi-trees__map"></div>
  <canvas id="chi-trees__accum"></canvas>
  <div id="chi-trees__title">Almost 70,000<br>trees planted<br>around Chicago</div>

  <div id="chi-trees__hud">
    <div id="chi-trees__date">Loading&hellip;</div>
  </div>

  <div id="chi-trees__controls">
    <button id="chi-trees__play" aria-label="Play or pause animation">
      <svg id="chi-trees__icon" viewBox="0 0 10 12" width="10" height="12" fill="white">
        <path id="chi-trees__path" d="M0,0 L10,6 L0,12 Z"/>
      </svg>
    </button>
    <div id="chi-trees__track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="chi-trees__fill"></div>
    </div>
  </div>
</div>

<style>
#chi-trees,
#chi-trees * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

#chi-trees {
  position: relative;
  width: 100%;
  height: 70vh;
  overflow: hidden;
  background: #0d0d0d;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
}

#chi-trees__map {
  position: absolute;
  inset: 0;
  z-index: 1;
  background-color: #0d0d0d !important;
}

#chi-trees .leaflet-control-zoom        { display: none !important; }
#chi-trees .leaflet-control-attribution {
  font-size: 8px !important;
  background: rgba(0,0,0,0.45) !important;
  color: #555 !important;
  padding: 2px 5px !important;
}
#chi-trees .leaflet-control-attribution a { color: #777 !important; }
#chi-trees .leaflet-tile {
  outline: 1px solid transparent;
}

#chi-trees__accum {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 400;
}

#chi-trees__title {
  position: absolute;
  top: 8%;
  left: 55%;
  z-index: 500;
  color: #fff;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: clamp(1.05rem, 4.5vw, 1.9rem);
  font-weight: bold;
  line-height: 1.2;
  max-width: clamp(130px, 33vw, 230px);
  text-align: left;
}

#chi-trees__hud {
  position: absolute;
  bottom: 48px;
  width: 100%;
  display: flex;
  justify-content: center;
  z-index: 500;
  pointer-events: none;
}

#chi-trees__date {
  font-size: clamp(0.8rem, 2.5vw, 1rem);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.85);
}

#chi-trees__controls {
  position: absolute;
  bottom: 14px;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  z-index: 500;
}

#chi-trees__play {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
  -webkit-appearance: none;
  appearance: none;
}
#chi-trees__play:hover { background: rgba(255,255,255,0.2); }

#chi-trees__track {
  width: clamp(160px, 48vw, 290px);
  height: 2px;
  background: rgba(255,255,255,0.18);
  border-radius: 1px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
}
#chi-trees__fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0%;
  background: rgba(255,255,255,0.75);
  border-radius: 1px;
}
</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
(function () {
  'use strict';

  var chiEl = document.getElementById('chi-trees');

  var placeholder = document.createElement('div');
  placeholder.style.cssText = 'width:100%;height:70vh;display:block;visibility:hidden;';
  chiEl.parentNode.insertBefore(placeholder, chiEl);
  document.body.appendChild(chiEl);
  chiEl.style.position = 'absolute';
  chiEl.style.left   = '0';
  chiEl.style.width  = '100vw';

  function alignToPlaceholder() {
    var rect = placeholder.getBoundingClientRect();
    chiEl.style.top = (rect.top + window.scrollY) + 'px';
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', alignToPlaceholder);
  } else {
    alignToPlaceholder();
  }
  window.addEventListener('load', alignToPlaceholder);
  window.addEventListener('resize', alignToPlaceholder);


  var CSV_URL = 'https://raw.githubusercontent.com/aadams-bga/tree-plantings/refs/heads/main/planting_latlong.csv';

  var STEP_MS     = 40;    // ms per day frame
  var END_PAUSE   = 2200;  // ms to hold at end before looping
  var DOT_R       = .8;     // dot radius in px (steady-state)
  var DOT_ALPHA   = 0.68;  // peak opacity of dots (0-1)
  var FADE_IN_MS  = 500;   //  ms for a dot to ramp from 0 -> full opacity
  var FADE_OUT_MS = 2000;  // ms for a dot to fade from full opacity -> 0
  var PULSE_MS    = 600;   // ms for the grow-then-shrink pulse on new dots
  var PULSE_SCALE = 1.5;     // peak radius multiplier during pulse

  var BOUNDS = L.latLngBounds([41.61, -87.97], [42.07, -87.15]);

  var map = L.map('chi-trees__map', {
    zoomControl:       false,
    attributionControl: true,
    dragging:          false,
    touchZoom:         false,
    scrollWheelZoom:   false,
    doubleClickZoom:   false,
    keyboard:          false,
    boxZoom:           false,
    tap:               false,
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; \x3ca href="https://www.openstreetmap.org/copyright"\x3eOpenStreetMap\x3c/a\x3e contributors &copy; \x3ca href="https://carto.com/attributions"\x3eCARTO\x3c/a\x3e',
    subdomains: 'abcd',
    maxZoom: 19,
  }).addTo(map);

  map.fitBounds(BOUNDS, { animate: false });

  var accumCanvas = document.getElementById('chi-trees__accum');
  var accumCtx    = accumCanvas.getContext('2d');
  var DPR = window.devicePixelRatio || 1;
  var CW  = 0; 
  var CH  = 0; 

  function resizeCanvases() {
    CW = accumCanvas.offsetWidth;
    CH = accumCanvas.offsetHeight;
    accumCanvas.width  = CW * DPR; accumCanvas.height = CH * DPR;
    accumCtx.scale(DPR, DPR);
  }
  resizeCanvases();

  function parseDate(s) {
    if (!s) return null;
    s = s.trim();
    var parts, m, d, y;
    if (s.indexOf('/') !== -1) {
      parts = s.split('/');
    } else if (s.indexOf('.') !== -1) {
      parts = s.split('.');
    } else {
      return null;
    }
    if (parts.length !== 3) return null;
    m = parseInt(parts[0], 10);
    d = parseInt(parts[1], 10);
    y = parseInt(parts[2], 10);
    if (isNaN(m) || isNaN(d) || isNaN(y)) return null;
    if (Math.sign(y - 100) === -1) y += 2000;
    return new Date(y, m - 1, d);
  }

  var MONTH_NAMES = [
    'January','February','March','April','May','June',
    'July','August','September','October','November','December'
  ];

  function dayLabel(date) {
    return MONTH_NAMES[date.getMonth()] + ' ' + date.getDate() + ', ' + date.getFullYear();
  }

  var months      = [];   // [{key, date, label, rawPts:[{lat,lng}], px:[{x,y}]}]
  var step        = 0;
  var playing     = true;
  var timer       = null;
  var rafId       = null;
  var monthShownAt = [];  


  var dateEl  = document.getElementById('chi-trees__date');
  var fillEl  = document.getElementById('chi-trees__fill');
  var trackEl = document.getElementById('chi-trees__track');
  var pathEl  = document.getElementById('chi-trees__path');

  var PAUSE_D = 'M1,1 L3.5,1 L3.5,11 L1,11 Z M5.5,1 L8,1 L8,11 L5.5,11 Z';
  var PLAY_D  = 'M1,0 L10,6 L1,12 Z';

  function setIcon(isPlaying) {
    pathEl.setAttribute('d', isPlaying ? PAUSE_D : PLAY_D);
  }

  document.getElementById('chi-trees__play').addEventListener('click', function () {
    playing = !playing;
    setIcon(playing);
    if (playing) scheduleNext();
    else { clearTimeout(timer); timer = null; }
  });

  trackEl.addEventListener('click', function (e) {
    if (!months.length) return;
    var rect = trackEl.getBoundingClientRect();
    var pct  = (e.clientX - rect.left) / rect.width;
    var target = Math.max(0, Math.min(months.length - 1, Math.floor(pct * months.length)));
    clearTimeout(timer); timer = null;
    scrubTo(target);
    if (playing) scheduleNext();
  });

  var TWO_PI = Math.PI * 2;

  function computePixels() {
    months.forEach(function (mo) {
      mo.px = mo.rawPts.map(function (p) {
        var pt = map.latLngToContainerPoint([p.lat, p.lng]);
        return { x: Math.round(pt.x), y: Math.round(pt.y) };
      });
    });
  }

  function batchArcs(ctx, pts, r) {
    pts.forEach(function (p) {
      ctx.moveTo(p.x + r, p.y);
      ctx.arc(p.x, p.y, r, 0, TWO_PI);
    });
  }

  function getRadius(monthIndex, now) {
    var t = monthShownAt[monthIndex];
    if (!t) return DOT_R;
    var age = now - t;
    if (age >= PULSE_MS) return DOT_R;
    var phase = age / PULSE_MS;
    return DOT_R * (1 + (PULSE_SCALE - 1) * (1 - Math.abs(2 * phase - 1)));
  }

  function getAlpha(monthIndex, now) {
    var t = monthShownAt[monthIndex];
    if (!t) return 0;
    var age = now - t;
    if (Math.sign(age) === -1) return 0;
    if (Math.sign(age - FADE_IN_MS) === -1) return DOT_ALPHA * age / FADE_IN_MS;
    var ageAfterIn = age - FADE_IN_MS;
    if (Math.sign(ageAfterIn - FADE_OUT_MS) !== -1) return 0;
    return DOT_ALPHA * (1 - ageAfterIn / FADE_OUT_MS);
  }

  function renderLoop() {
    var now = Date.now();
    accumCtx.clearRect(0, 0, CW, CH);
    for (var i = 0; i <= step; i++) {
      var alpha = getAlpha(i, now);
      if (alpha <= 0.001) continue;
      var r = getRadius(i, now);
      accumCtx.beginPath();
      batchArcs(accumCtx, months[i].px, r);
      accumCtx.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
      accumCtx.fill();
    }
    rafId = requestAnimationFrame(renderLoop);
  }

  function scrubTo(target) {
    step = target;
    var now = Date.now();
    var i = 0;
    while (i !== target + 1) {
      monthShownAt[i] = now - (target - i) * STEP_MS - FADE_IN_MS;
      i++;
    }
    updateHUD(step);
  }

  function updateHUD(s) {
    var d = months[s].date;
    dateEl.textContent = MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear();
    var pct = ((s + 1) / months.length * 100).toFixed(1);
    fillEl.style.width = pct + '%';
    trackEl.setAttribute('aria-valuenow', pct);
  }

  function drawStep(s) {
    monthShownAt[s] = Date.now();
    updateHUD(s);
  }

  function scheduleNext() {
    if (!playing) return;
    var isLast = step === months.length - 1;
    timer = setTimeout(function () {
      if (!playing) return;
      if (isLast) {
        // Reset for loop
        step = 0;
        monthShownAt = [];
        accumCtx.clearRect(0, 0, CW, CH);
      } else {
        step++;
      }
      drawStep(step);
      scheduleNext();
    }, isLast ? END_PAUSE : STEP_MS);
  }

  d3.csv(CSV_URL).then(function (rows) {
    var byDay = new Map();

    function dateKey(date) {
      return date.getFullYear() * 10000 + (date.getMonth() + 1) * 100 + date.getDate();
    }

    rows.forEach(function (r) {
      var lat = parseFloat(r.lat);
      var lng = parseFloat(r.long);
      if (isNaN(lat) || isNaN(lng) || !r.Date) return;
      var date = parseDate(r.Date);
      if (!date) return;
      var key = dateKey(date);
      if (!byDay.has(key)) {
        byDay.set(key, {
          key:    key,
          date:   date,
          label:  dayLabel(date),
          rawPts: [],
          px:     [],
        });
      }
      byDay.get(key).rawPts.push({ lat: lat, lng: lng });
    });

    if (byDay.size) {
      var allKeys = Array.from(byDay.keys()).sort(function (a, b) { return a - b; });
      var cursor  = new Date(byDay.get(allKeys[0]).date);
      var last    = new Date(byDay.get(allKeys[allKeys.length - 1]).date);
      while (cursor <= last) {
        var k = dateKey(cursor);
        if (!byDay.has(k)) {
          byDay.set(k, { key: k, date: new Date(cursor), label: dayLabel(cursor), rawPts: [], px: [] });
        }
        cursor.setDate(cursor.getDate() + 1);
      }
    }

    months = Array.from(byDay.values()).sort(function (a, b) { return a.key - b.key; });

    map.whenReady(function () {
      computePixels();
      setIcon(true);
      drawStep(0);
      renderLoop();
      scheduleNext();
    });

  }).catch(function (err) {
    console.error('chi-trees: could not load CSV -', err);
  });

  var resizeDebounce;
  window.addEventListener('resize', function () {
    clearTimeout(resizeDebounce);
    resizeDebounce = setTimeout(function () {
      cancelAnimationFrame(rafId);
      resizeCanvases();
      map.fitBounds(BOUNDS, { animate: false });
      if (months.length) {
        computePixels();
        updateHUD(step);
        renderLoop();
      }
    }, 160);
  });

}());
</script>
